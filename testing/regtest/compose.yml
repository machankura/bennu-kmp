# A regtest network for the group Lightning wallet's end-to-end run (docs/group-lightning-wallet.md,
# "The regtest run"): bitcoind, electrs for the group's Electrum client, an eclair LSP speaking
# Phoenix's taproot channels and on-the-fly funding, and a second eclair that pays the group and is
# paid by it. Every port is bound to localhost, in a range nothing else on a development machine uses.
name: bennu-regtest

services:
  bitcoind:
    image: bitcoin/bitcoin:31.1
    command:
      - -printtoconsole
      - -regtest=1
      - -server=1
      - -txindex=1
      # foo:bar for eclair and the scripts; the cookie, readable by all, for electrs.
      - -rpcauth=foo:abd66bf47451e26a7809d47370140dc9$$101b2636d908b296314aaad45c40bb42e0bbf631ea37b3f7767319e638e1662e
      - -rpccookieperms=all
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.0002
      - -listen=1
      - -bind=0.0.0.0
      - -zmqpubhashblock=tcp://0.0.0.0:29000
      - -zmqpubrawtx=tcp://0.0.0.0:29001
    volumes:
      - bitcoind:/home/bitcoin/.bitcoin
    ports:
      - "127.0.0.1:28443:18443"

  electrs:
    image: getumbrel/electrs:v0.11.1
    # bitcoind's data directory is its own; root is what reads the cookie in it.
    user: root
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --daemon-p2p-addr=bitcoind:18444
      - --electrum-rpc-addr=0.0.0.0:50001
      - --cookie-file=/bitcoin/regtest/.cookie
      - --db-dir=/tmp/electrs
    depends_on: [bitcoind]
    volumes:
      - bitcoind:/bitcoin:ro
    ports:
      - "127.0.0.1:28001:50001"

  lsp:
    image: acinq/eclair:v0.14.4
    depends_on: [bitcoind]
    volumes:
      - ./lsp.conf:/data/eclair.conf:ro
    ports:
      - "127.0.0.1:29735:9735"
      - "127.0.0.1:28080:8080"

  payer:
    image: acinq/eclair:v0.14.4
    depends_on: [bitcoind]
    volumes:
      - ./payer.conf:/data/eclair.conf:ro
    ports:
      - "127.0.0.1:29736:9735"
      - "127.0.0.1:28081:8080"

volumes:
  bitcoind:
