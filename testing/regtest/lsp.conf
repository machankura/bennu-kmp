// The LSP: what Phoenix's ACINQ node offers a wallet, as far as eclair's public features go. Not
// zero-conf: eclair takes that only per peer, and the group's node id is not known until its wallet is
// made, so the run mines the funding transaction instead.
eclair {
  chain = "regtest"
  node-alias = "bennu-lsp"
  server.binding-ip = "0.0.0.0"
  api {
    enabled = true
    binding-ip = "0.0.0.0"
    port = 8080
    password = "lsp"
  }
  bitcoind {
    host = "bitcoind"
    rpcport = 18443
    rpcuser = "foo"
    rpcpassword = "bar"
    wallet = "lsp"
    zmqblock = "tcp://bitcoind:29000"
    zmqtx = "tcp://bitcoind:29001"
  }
  trampoline-payments-enable = true
  // Messages and payments to a wallet node go through eclair's wake-up path, even when it is connected.
  peer-wake-up.enabled = true
  features {
    option_dual_fund = optional
    option_splice = optional
    option_quiesce = optional
    option_simple_close = optional
    option_simple_taproot_phoenix = optional
    // part of the Phoenix taproot channel type
    phoenix_zero_reserve = optional
    option_provide_storage = optional
    on_the_fly_funding = optional
    funding_fee_credit = optional
    trampoline_payment_prototype = optional
  }
  channel {
    // Advertise the whole channel: eclair otherwise caps an update by the balance it had when it was made,
    // which for a channel the other side funded is nothing, and refreshes it only now and then.
    channel-update.balance-thresholds = []
    // A wallet opening on the fly contributes nothing: the LSP funds the channel and is paid from the payment.
    min-private-funding-satoshis = 0
    // How long the group waits for its own output after a force close: short, so the run's sweep comes soon.
    to-remote-delay-blocks = 144
    // A channel opened on the fly is the size of the payment that opened it, so all of it is in flight at once.
    max-htlc-value-in-flight-percent = 100
  }
  // On-the-fly funding sells the wallet the inbound liquidity a payment needs, paid from the payment.
  liquidity-ads {
    funding-rates = [
      {
        min-funding-amount-satoshis = 10000
        max-funding-amount-satoshis = 10000000
        funding-weight = 400
        fee-base-satoshis = 100
        fee-basis-points = 100
        channel-creation-fee-satoshis = 1000
      }
    ]
    payment-types = ["from_channel_balance", "from_future_htlc", "from_future_htlc_with_preimage", "from_channel_balance_for_future_htlc"]
  }
}
