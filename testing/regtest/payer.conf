// Somebody else on the network: pays the group through the LSP, and is paid by it.
eclair {
  chain = "regtest"
  node-alias = "bennu-payer"
  server.binding-ip = "0.0.0.0"
  api {
    enabled = true
    binding-ip = "0.0.0.0"
    port = 8080
    password = "payer"
  }
  bitcoind {
    host = "bitcoind"
    rpcport = 18443
    rpcuser = "foo"
    rpcpassword = "bar"
    wallet = "payer"
    zmqblock = "tcp://bitcoind:29000"
    zmqtx = "tcp://bitcoind:29001"
  }
  // Advertise the whole channel: eclair otherwise caps an update by the balance it had when it was made.
  channel.channel-update.balance-thresholds = []
  features {
    option_dual_fund = optional
    option_splice = optional
    option_quiesce = optional
    option_simple_close = optional
  }
}
